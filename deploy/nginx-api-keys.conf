# Klíče a cache pro /api proxy. Patří do http { } kontextu, tj.
# /etc/nginx/conf.d/tabule-keys.conf. Do repa jde jen šablona –
# skutečné klíče doplň až na serveru.
#
# nginx na Ubuntu neumí envsubst jako docker image, proto jsou klíče
# rovnou tady. Soubor ať čte jen root: chmod 600.

map $http_x_api_slot $golemio_key {
    default     "DOPLN_GOLEMIO_KEY_1";
    "k1"        "DOPLN_GOLEMIO_KEY_1";
    "k2"        "DOPLN_GOLEMIO_KEY_2";
    "k3"        "DOPLN_GOLEMIO_KEY_3";
    # pragensis vypnutý – bere klíč 1
    "pragensis" "DOPLN_GOLEMIO_KEY_1";
}

map "" $weather_key {
    default "DOPLN_WEATHERAPI_KEY";
}

# Sdílená cache: stejný dotaz z více tabulí se na Golemio pošle jednou.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m
                 max_size=64m inactive=10m use_temp_path=off;
