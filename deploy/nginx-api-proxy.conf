# Proxy na API pro holý nginx na Ubuntu (timetable.brozovec.eu).
#
# Bundle od commitu c0b27ee volá /api/* na vlastním originu a posílá jen
# jméno slotu (X-Api-Slot). Bez těchhle bloků spadne /api na SPA fallback,
# vrátí index.html a tabule hlásí „Chyba načítání“.
#
# Instalace:
#   1. sudo cp deploy/nginx-api-proxy.conf /etc/nginx/snippets/tabule-api.conf
#   2. sudo cp deploy/nginx-api-keys.conf   /etc/nginx/conf.d/tabule-keys.conf
#      a do něj doplnit skutečné klíče (soubor s klíči NEpatří do repa)
#   3. do server { } bloku timetable.brozovec.eu přidat:
#        include snippets/tabule-api.conf;
#      PŘED `location / { try_files ... /index.html; }`
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. curl -sI "https://timetable.brozovec.eu/api/pid/v2/pid/departureboards?ids=U865Z1P" | grep content-type
#      musí být application/json, ne text/html

# ── výluky a mimořádnosti ────────────────────────────────────────
# api/pid-alerts.ts je Vercel funkce, kterou tenhle server nespustí,
# a žádný Vercel deploy s ní neběží. Klient při chybě spadne na prázdný
# seznam (src/utils/pidAlerts.ts), takže vracíme 503 místo index.html.
# Přesná shoda má přednost před /api/pid/ níž.
location = /api/pid-alerts {
    add_header Content-Type application/json;
    return 503 '{"error":"pid-alerts není na tomhle serveru nasazený"}';
}

# ── PID / Golemio ────────────────────────────────────────────────
location /api/pid/ {
    proxy_pass https://api.golemio.cz/;
    proxy_set_header Host api.golemio.cz;
    proxy_set_header X-Access-Token $golemio_key;
    proxy_set_header X-Api-Slot "";
    proxy_ssl_server_name on;

    proxy_cache api;
    proxy_cache_valid 200 20s;
    proxy_cache_key "$request_uri|$http_x_api_slot";
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

# ── počasí (weatherapi.com) ──────────────────────────────────────
location ~ ^/api/weather/(?<wpath>.*)$ {
    proxy_pass https://api.weatherapi.com/v1/$wpath?key=$weather_key&$args;
    proxy_set_header Host api.weatherapi.com;
    proxy_ssl_server_name on;

    proxy_cache api;
    proxy_cache_valid 200 10m;
    proxy_cache_key "$wpath|$args";
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}
